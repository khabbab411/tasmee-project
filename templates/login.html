<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مقرأة زاد الفرقان</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#f3f5f7;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:380px;
background:#fff;
padding:35px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:8px;
}

.subtitle{
text-align:center;
margin-bottom:25px;
color:#666;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#0b6efd;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0958c9;
}

.error{
background:#ffe5e5;
color:#b00020;
padding:10px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

.footer{
margin-top:20px;
text-align:center;
font-size:13px;
color:#888;
}

</style>

</head>

<body>

<div class="card">

<h1>📖</h1>

<h2 style="text-align:center;">مقرأة زاد الفرقان</h2>

<p class="subtitle">

لوحة المعلمين

</p>

{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}

<form method="POST">

<input

type="text"

name="username"

placeholder="اسم المستخدم"

required>

<input

type="password"

name="password"

placeholder="كلمة المرور"

required>

<button type="submit">

تسجيل الدخول

</button>

</form>

<div class="footer">

الإصدار 0.3

</div>

</div>

</body>

</html>
