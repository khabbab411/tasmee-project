<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المعلمات</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Tahoma,sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:white;
            width:360px;
            padding:35px;
            border-radius:18px;
            box-shadow:0 10px 25px rgba(0,0,0,.12);
        }

        h1{
            text-align:center;
            color:#1f2937;
            margin-bottom:8px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:10px;
            margin-bottom:15px;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#2b7cff;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#2b7cff;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1e63d6;
        }

        .footer{
            text-align:center;
            margin-top:20px;
            color:#888;
            font-size:13px;
        }
    </style>

</head>

<body>

<div class="card">

<h1>📖 مقرأة القرآن</h1>

<p>لوحة المعلمات</p>

<form>

<input
type="text"
placeholder="اسم المستخدم">

<input
type="password"
placeholder="كلمة المرور">

<button>

تسجيل الدخول

</button>

</form>

<div class="footer">

الإصدار الأول

</div>

</div>

</body>
</html>
